name: Soak allocator provenance
on:
  pull_request:
    paths:
      - 'scripts/soak_mappings.py'
      - 'scripts/audit_soak_allocations.py'
      - 'scripts/tests/test_soak_allocations.py'
      - '.github/workflows/soak-allocations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  allocator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build: [ordinary, race]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
      - name: Ensure strace stack unwinding is available
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y strace
          fi
          mkdir -p artifacts
          strace -V > artifacts/strace-version.txt 2>&1
      - run: python3 -m unittest discover -s scripts/tests
      - name: Build unchanged Go probe and known allocation control
        env:
          BUILD: ${{ matrix.build }}
        run: |
          extra=()
          if [ "$BUILD" = race ]; then extra+=(-race); fi
          go build "${extra[@]}" -trimpath -o bin/probe ./scripts/soak24h
          go build "${extra[@]}" -trimpath -o bin/control ./scripts/mappingcontrol
          sha256sum bin/probe bin/control "$(go env GOROOT)/src/runtime/race/internal/amd64v1/race_linux.syso" > artifacts/binary-sha256.txt
      - name: Known allocation with mmap call stacks
        run: |
          status=0
          strace -f -k -ttt -T -e trace=mmap,munmap,mremap,brk,clone,clone3,fork,vfork,execve -o artifacts/control.trace python3 scripts/soak_mappings.py control --binary bin/control --artifacts artifacts/control || status=1
          python3 scripts/audit_soak_allocations.py artifacts/control --trace artifacts/control.trace --control --output artifacts/control-allocations.json || status=1
          exit "$status"
      - name: Preserve traced pilot and untraced three-minute pilot separately
        run: |
          status=0
          strace -f -k -ttt -T -e trace=mmap,munmap,mremap,brk,clone,clone3,fork,vfork,execve -o artifacts/pilot.trace python3 scripts/soak_mappings.py capture --binary bin/probe --artifacts artifacts/traced || status=1
          python3 scripts/audit_soak_allocations.py artifacts/traced --trace artifacts/pilot.trace --output artifacts/pilot-allocations.json || status=1
          python3 scripts/soak_mappings.py capture --binary bin/probe --duration-seconds 180 --artifacts artifacts/untraced-180 || status=1
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak-allocations-${{ matrix.build }}
          path: artifacts
          retention-days: 30
