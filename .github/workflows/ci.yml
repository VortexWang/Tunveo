name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: go mod download
      - run: go mod verify
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build -trimpath -o bin/tunveo ./cmd/tunveo
      - run: ./bin/tunveo version
      - run: ./bin/tunveo help
  forwarding:
    # This job intentionally reports failures in the inherited baseline.
    # Do not make it advisory or suppress failures before the defects are fixed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o bin/tunveo ./cmd/tunveo
      - run: python3 scripts/verify_forwarding.py --binary bin/tunveo --artifacts artifacts/forwarding
      - name: Save forwarding evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forwarding-evidence
          path: artifacts/forwarding
          retention-days: 14
  verification-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
      - run: go build -o bin/repro-tls-verify ./scripts/repro_tls_verify
      # This regression must stay green after the ownership fix; M1 records the red baseline.
      - run: mkdir -p artifacts && ./bin/repro-tls-verify > artifacts/tls-verification-regression.json
      - name: Save deterministic regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tls-verification-regression
          path: artifacts/tls-verification-regression.json
          retention-days: 14

  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o bin/tunveo ./cmd/tunveo
      - run: python3 scripts/verify_security.py --binary bin/tunveo --output artifacts/security.json
      - run: python3 scripts/verify_reload_interval.py --binary bin/tunveo --output artifacts/reload-interval.json
      - name: Save security regression summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-evidence
          path: |
            artifacts/security.json
            artifacts/reload-interval.json
          retention-days: 14

  vulnerability-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # The text scan's nonzero exit is the gate. JSON alone exits zero even
      # when it reports findings; pipefail preserves failures while tee saves text.
      - name: Scan reachable vulnerabilities
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          govulncheck ./... 2>&1 | tee artifacts/govulncheck.txt
      - name: Save vulnerability scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerability-evidence
          path: artifacts/govulncheck.txt
          retention-days: 14

  pool-publication-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
      - run: python3 scripts/repro_pool_publication.py --ref HEAD --mode fixed --go go --output artifacts/pool-publication.json
      - name: Save publication schedule evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pool-publication-evidence
          path: artifacts/pool-publication.json
          retention-days: 14

  lifecycle-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
      - run: python3 scripts/repro_pool_lifecycle.py --ref HEAD --mode fixed --go go --output artifacts/pool-lifecycle.json
      - run: go build -race -trimpath -o bin/tunveo-race ./cmd/tunveo
      - run: python3 scripts/verify_reconnect.py --binary bin/tunveo-race --artifacts artifacts/reconnect
      - name: Save lifecycle and reconnect evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lifecycle-evidence
          path: |
            artifacts/pool-lifecycle.json
            artifacts/reconnect
          retention-days: 14

  h2-deadline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
      - run: python3 scripts/repro_h2_deadlines.py --ref HEAD --mode fixed --go go --output artifacts/h2-deadlines.json
      - run: go test -race -count=10 -run '^Test(DeadlineIO|H2CloseAndCancel)' ./internal/tunnelpool/http2
      - name: Save native stream deadline evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: h2-deadline-evidence
          path: artifacts/h2-deadlines.json
          retention-days: 14

  management-boundary-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
      - run: python3 scripts/repro_management_boundaries.py --ref HEAD --mode fixed --go go --output artifacts/management-native.json
      - run: go build -race -trimpath -o bin/tunveo-race ./cmd/tunveo
      - run: python3 scripts/verify_management.py --binary bin/tunveo-race --output artifacts/management-process.json
      - name: Save management regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: management-boundary-evidence
          path: artifacts/management*.json
          retention-days: 14

  master-state-lifecycle-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
      - run: python3 scripts/repro_master_state.py --ref HEAD --mode fixed --go go --output artifacts/master-state-native.json
      - run: go build -race -trimpath -o bin/tunveo-race ./cmd/tunveo
      - run: python3 scripts/verify_master_lifecycle.py --binary bin/tunveo-race --output artifacts/master-lifecycle.json
      - name: Save master ownership and child lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: master-state-lifecycle-evidence
          path: artifacts/master*
          retention-days: 14
