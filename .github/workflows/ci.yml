name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go mod verify
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build -trimpath -o bin/tunveo ./cmd/tunveo
      - run: ./bin/tunveo version
      - run: ./bin/tunveo help
  forwarding:
    # This job intentionally reports failures in the inherited baseline.
    # Do not make it advisory or suppress failures before the defects are fixed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o bin/tunveo ./cmd/tunveo
      - run: python3 scripts/verify_forwarding.py --binary bin/tunveo
