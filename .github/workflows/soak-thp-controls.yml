name: Independent THP controls ABBA
on:
  pull_request:
    paths:
      - 'scripts/soak_thp_compare.py'
      - 'scripts/thpcontrol/**'
      - 'scripts/tests/test_thp_controls.py'
      - '.github/workflows/soak-thp-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        build: [ordinary, race]
        control: [go_heap, process]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
      - name: Regression and unchanged-policy clean builds
        timeout-minutes: 8
        run: |
          python3 -m unittest discover -s scripts/tests
          go test ./scripts/soak24h
          test -z "$(git status --porcelain)"
          go build -trimpath -o bin/ordinary ./scripts/soak24h
          test -z "$(git status --porcelain)"
          go build -race -trimpath -o bin/race ./scripts/soak24h
          gcc -Wall -Wextra -Werror -O1 -o bin/thp-control scripts/thpcontrol/main.c
      - name: Baseline control control baseline on one host
        timeout-minutes: 90
        run: python3 scripts/soak_thp_compare.py --ordinary bin/ordinary --race bin/race --launcher bin/thp-control --build '${{ matrix.build }}' --control '${{ matrix.control }}' --artifacts 'artifacts/${{ matrix.build }}-${{ matrix.control }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        timeout-minutes: 3
        with:
          name: thp-${{ matrix.build }}-${{ matrix.control }}
          path: artifacts
          retention-days: 30
