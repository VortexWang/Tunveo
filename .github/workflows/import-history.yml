name: Import Tunveo history
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/import-history.yml'
permissions:
  contents: write
concurrency:
  group: tunveo-history-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Verify manifest and restore exact commits
        env:
          HISTORY_DIR: ${{ runner.temp }}/tunveo-history
        run: |
          echo '6d0f1a1981281ab2ac8e7d8af55aa1ee62b5c618f7c77c166368d0957541efce  .bootstrap/history.json' | sha256sum -c -
          python3 .bootstrap/import_history.py .bootstrap/history.json "$HISTORY_DIR"
          git fetch --no-tags "$HISTORY_DIR" 62bb7c84d4d5d3e739bd7819cb59f140360de7a3
      - name: Attach complete history without overwriting concurrent changes
        env:
          EXPECTED_BOOTSTRAP_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_BOOTSTRAP_SHA"
          imported=62bb7c84d4d5d3e739bd7819cb59f140360de7a3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          imported_tree=$(git rev-parse "$imported^{tree}")
          attached=$(git commit-tree "$imported_tree" -p "$EXPECTED_BOOTSTRAP_SHA" -p "$imported" -m 'chore: attach complete Tunveo bootstrap history')
          git update-ref refs/tags/upstream/nodepass-v1.17.0 114345043d9608e1e24e783a270cde75193e4f42
          git push --atomic origin "$attached:refs/heads/main" refs/tags/upstream/nodepass-v1.17.0
