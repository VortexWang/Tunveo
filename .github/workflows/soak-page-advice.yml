name: Soak page advice ledger
on:
  pull_request:
    paths:
      - 'scripts/soak_page_advice.py'
      - 'scripts/soak_mapping_retention.py'
      - 'scripts/soak_mapping_ledger.py'
      - 'scripts/soak_mappings.py'
      - 'scripts/audit_soak_retention.py'
      - 'scripts/audit_soak_os_memory.py'
      - 'scripts/verify_soak.py'
      - 'scripts/soak24h/**'
      - 'scripts/soak_ret_context.py'
      - 'scripts/tests/test_soak_mapping_ledger.py'
      - 'scripts/tests/test_soak_mapping_retention.py'
      - 'scripts/tests/test_soak_page_advice.py'
      - 'scripts/advicecontrol/**'
      - '.github/workflows/soak-page-advice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    # Step budgets total 56 minutes; reserve 4 minutes for setup/cleanup.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
      - name: Build pinned tracer with instruction-boundary checking and unsafe disabled
        timeout-minutes: 25
        run: |
          mkdir -p artifacts
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build bison flex g++ zlib1g-dev libelf-dev libbpf-dev libbpfcc-dev libcereal-dev libdw-dev libfl-dev binutils-dev libiberty-dev libzstd-dev llvm-18-dev libclang-18-dev libclang-cpp18-dev clang-18
          tracer_source="$RUNNER_TEMP/bpftrace-source"
          git init "$tracer_source"
          git -C "$tracer_source" remote add origin https://github.com/bpftrace/bpftrace.git
          git -C "$tracer_source" fetch --depth=1 origin 93c593f6dab2e930d6198cfaa52b29d19a8c0647
          git -C "$tracer_source" checkout --detach FETCH_HEAD
          git -C "$tracer_source" rev-parse HEAD > artifacts/tracer-source.txt
          test "$(cat artifacts/tracer-source.txt)" = 93c593f6dab2e930d6198cfaa52b29d19a8c0647
          cmake -S "$tracer_source" -B "$tracer_source/build" -G Ninja -DBUILD_TESTING=OFF -DENABLE_MAN=OFF -DENABLE_SKB_OUTPUT=OFF -DALLOW_UNSAFE_PROBE=OFF -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DCMAKE_BUILD_TYPE=Release '-DCMAKE_CXX_FLAGS_RELEASE=-O1 -DNDEBUG' > artifacts/tracer-configure.log 2>&1
          cmake --build "$tracer_source/build" --parallel 2 --target bpftrace > artifacts/tracer-build.log 2>&1
          cp "$tracer_source/build/CMakeCache.txt" artifacts/tracer-CMakeCache.txt
          tracer_binary="$tracer_source/build/src/bpftrace"
          sudo "$tracer_binary" --info > artifacts/bpftrace-info.txt 2>&1
          "$tracer_binary" --version > artifacts/bpftrace-version.txt
          sha256sum "$tracer_binary" > artifacts/tracer-binary.sha256
          python3 -c "from pathlib import Path; s=Path('artifacts/bpftrace-info.txt').read_text(); assert 'bfd: yes' in s and 'unsafe probe: no' in s, s"
          sudo "$tracer_binary" -lv 'tracepoint:syscalls:sys_enter_madvise' > artifacts/madvise-enter-layout.txt 2>&1
          sudo "$tracer_binary" -lv 'tracepoint:syscalls:sys_exit_madvise' > artifacts/madvise-exit-layout.txt 2>&1
          python3 -c "import sys; from pathlib import Path; sys.path.insert(0,'scripts'); from soak_page_advice import validate_layout; validate_layout(Path('artifacts/madvise-enter-layout.txt').read_text(), Path('artifacts/madvise-exit-layout.txt').read_text())"
          dpkg-query -W > artifacts/build-package-versions.txt
          uname -a > artifacts/kernel.txt
          cat /proc/sys/kernel/perf_event_paranoid > artifacts/perf-event-paranoid.txt
          cat /proc/sys/kernel/unprivileged_bpf_disabled > artifacts/unprivileged-bpf-disabled.txt
      - run: python3 -m unittest discover -s scripts/tests
        timeout-minutes: 2
      - name: Build unchanged probe and known allocation control
        timeout-minutes: 3
        run: |
          go build -race -trimpath -o bin/probe ./scripts/soak24h
          gcc -g -O1 -fomit-frame-pointer -fno-optimize-sibling-calls -no-pie -o bin/advice-control scripts/advicecontrol/main.c
          sha256sum bin/probe bin/advice-control > artifacts/binary-sha256.txt
      - name: Page discard and reuse control before bounded Go load and retention
        timeout-minutes: 21
        run: timeout --signal=TERM 20m python3 scripts/soak_page_advice.py --binary bin/probe --control bin/advice-control --tracer "$RUNNER_TEMP/bpftrace-source/build/src/bpftrace" --artifacts artifacts/experiment
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        if: always()
        with:
          name: page-advice-ledger
          path: artifacts
          retention-days: 30


