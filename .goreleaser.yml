version: 2
project_name: tunveo

snapshot:
  version_template: '0.0.0-SNAPSHOT-{{ .ShortCommit }}'

builds:
  - binary: tunveo
    env:
      - CGO_ENABLED=0
    main: ./cmd/tunveo
    goos: [darwin, freebsd, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - docs/*.md
      - docs/upstream/**
      - internal/tunnelpool/**/LICENSE

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
