version: 2
project_name: tunveo

builds:
  - binary: tunveo
    env:
      - CGO_ENABLED=0
    main: ./cmd/tunveo
    goos: [darwin, freebsd, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - docs/upstream/**
      - internal/tunnelpool/**/LICENSE

release:
  prerelease: auto
